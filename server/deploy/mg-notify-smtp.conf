# Inbound email: public port 25 passed straight through to the server's SMTP
# receiver (inbound_email.smtp_bind_port in config.json), so the server needn't
# run as root. The server does STARTTLS itself.
# Lives in /etc/nginx/streams-enabled/, included from a stream {} block in
# nginx.conf (outside http {}):  stream { include /etc/nginx/streams-enabled/*.conf; }
server {
    listen 25;
    listen [::]:25;
    proxy_pass 127.0.0.1:2525;
    proxy_connect_timeout 5s;
    # Senders may wait up to 10 minutes on DATA (RFC 5321).
    proxy_timeout 11m;
}

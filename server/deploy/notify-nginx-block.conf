# The notify.mad-gamer.com server block (in /etc/nginx/sites-available/sites.conf).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notify.mad-gamer.com mg-notify-inbound.mad-gamer.com;
    include /etc/nginx/snippets/ssl-wildcard.conf;
    # The MG Notify website (static files); the old PHP portal is still in /var/www/notify.
    root /var/www/notify-site;
    include /etc/nginx/snippets/mg-notify-site.conf;
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

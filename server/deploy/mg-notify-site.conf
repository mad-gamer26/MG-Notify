# The MG Notify website: static files, strict security headers.
index index.html;
error_page 404 /404.html;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: http: data:; media-src 'self' blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Browsers check for a newer copy every time (cheap, thanks to ETags), so
# updates show up at once.
location / {
    try_files $uri $uri/ =404;
    expires -1;
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
}
location /assets/sounds/ {
    types { audio/wav wav; }
    expires -1;
}
# Android releases and the update manifest (Apps/Android/publish.sh puts them there).
location /downloads/ {
    alias /var/www/notify-downloads/;
    types { application/vnd.android.package-archive apk; application/json json; }
    expires -1;
}

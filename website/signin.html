<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in – MG Notify</title>
    <link rel="icon" href="/assets/favicon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/common.js" defer></script>
    <script src="/assets/auth.js" defer></script>
</head>
<body data-page="signin">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
    <div class="inner">
        <a class="brand" href="/"><img src="/assets/icon-192.png" alt=""> MG Notify</a>
        <nav class="site-nav" aria-label="Site">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/docs.html">Documentation</a></li>
                <li><a href="/signin.html" aria-current="page">Sign in</a></li>
            </ul>
        </nav>
    </div>
</header>

<main id="main" class="narrow">
    <h1 id="page-title">Sign in to MG Notify</h1>
    <div class="card">
        <div class="tabs" role="tablist" aria-label="Account">
            <button type="button" role="tab" id="tab-login" aria-controls="auth-panel" aria-selected="true" data-mode="login">Sign in</button>
            <button type="button" role="tab" id="tab-register" aria-controls="auth-panel" aria-selected="false" tabindex="-1" data-mode="register">Create account</button>
            <button type="button" role="tab" id="tab-forgot" aria-controls="auth-panel" aria-selected="false" tabindex="-1" data-mode="forgot">Forgot password</button>
        </div>
        <div id="auth-panel" role="tabpanel" aria-labelledby="tab-login">
            <div id="auth-message" class="message" role="alert"></div>
            <form id="auth-form" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="username" required spellcheck="false" autocapitalize="off">
                </div>
                <div class="field" id="password-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-hint">
                    <span class="hint" id="password-hint" hidden>Your password must be at least 8 characters.</span>
                </div>
                <label class="check" id="show-password-row"><input type="checkbox" id="show-password"> Show password</label>
                <label class="check" id="remember-row"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
                <button class="button wide" type="submit" id="submit">Sign in</button>
            </form>
        </div>
    </div>
    <p class="muted small">By creating an account you agree to use MG Notify responsibly. See <a href="/docs.html#privacy">what MG Notify stores</a>.</p>
</main>

<footer class="site-footer">
    <div class="inner">
        <span>&copy; <span id="year">2026</span> MG Notify</span><span>Version 2.0</span>
        <a href="/docs.html">Documentation</a>
        <a href="mailto:mattdovi@icloud.com">Contact</a>
        <a href="https://github.com/mad-gamer26/MG-Notify">Source code</a>
    </div>
</footer>
<div id="status-region" class="visually-hidden" role="status" aria-live="polite"></div>
<div id="alert-region" class="visually-hidden" role="alert" aria-live="assertive"></div>
</body>
</html>
